name: Deploy configuration UI to GitHub Pages

on:
  push:
    paths:
      - 'index.html'
      - 'config_generator.html'
      - 'dashboard.html'
      - 'account_table.js'
      - 'account_table.css'
      - 'github_config_ui.js'
      - 'github_browser_config.js'
      - 'vendor/**'
      - 'scripts/build_pages.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout static source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /config_generator.html
            /dashboard.html
            /account_table.js
            /account_table.css
            /github_config_ui.js
            /github_browser_config.js
            /vendor/
            /scripts/build_pages.py

      - name: Set up Python for static packaging
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Package public assets only
        run: python scripts/build_pages.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
